name: Controlla News Americisss

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Per ora lasciamo attivo il controllo che già funziona
      - name: Controlla pagina News
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python check_news.py

      # Diagnostica: mostra il testo che GitHub riceve dalla pagina
      - name: Diagnostica pagina News
        run: |
          python - <<'PY'
          import urllib.request
          from html.parser import HTMLParser

          url = "https://www.americisss.it/news/"

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          html = urllib.request.urlopen(
              request,
              timeout=30
          ).read().decode("utf-8", errors="ignore")

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.text = []

              def handle_data(self, data):
                  data = " ".join(data.split())

                  if data:
                      self.text.append(data)

          parser = TextParser()
          parser.feed(html)

          print("===== TESTO PAGINA NEWS =====")

          for text in parser.text:
              print(text)

          print("===== FINE TESTO =====")
          PY

      # Salva lo stato normalmente
      - name: Salva stato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_news.json
          git diff --cached --quiet || git commit -m "Aggiorna stato news"
          git push
